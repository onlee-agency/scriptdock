<button type="button" class="sd-back-to-top" aria-label="Back to top" hidden>
	<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>
<style>
	.sd-back-to-top{position:fixed;right:20px;bottom:20px;z-index:9999;width:44px;height:44px;border:0;border-radius:50%;background:#111;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;opacity:.85;transition:opacity .2s,transform .2s}
	.sd-back-to-top:hover,.sd-back-to-top:focus-visible{opacity:1;transform:translateY(-2px)}
	.sd-back-to-top[hidden]{display:none}
	@media (prefers-reduced-motion:reduce){.sd-back-to-top{transition:none}}
</style>
<script>
	( function () {
		var button = document.querySelector( '.sd-back-to-top' );
		if ( ! button ) {
			return;
		}
		var toggle = function () {
			button.hidden = window.scrollY < 400;
		};
		window.addEventListener( 'scroll', toggle, { passive: true } );
		toggle();
		button.addEventListener( 'click', function () {
			var smooth = ! window.matchMedia( '(prefers-reduced-motion: reduce)' ).matches;
			window.scrollTo( { top: 0, behavior: smooth ? 'smooth' : 'auto' } );
		} );
	} )();
</script>
