<div class="sd-reading-progress" aria-hidden="true"><span></span></div>
<style>
	.sd-reading-progress{position:fixed;top:0;left:0;right:0;height:4px;z-index:99999;pointer-events:none}
	.admin-bar .sd-reading-progress{top:32px}
	@media screen and (max-width:782px){.admin-bar .sd-reading-progress{top:46px}}
	.sd-reading-progress span{display:block;height:100%;width:100%;background:#2563eb;transform-origin:0 50%;transform:scaleX(0)}
</style>
<script>
	( function () {
		var bar = document.querySelector( '.sd-reading-progress span' );
		if ( ! bar ) {
			return;
		}
		var update = function () {
			var max = document.documentElement.scrollHeight - window.innerHeight;
			bar.style.transform = 'scaleX(' + ( max > 0 ? Math.min( 1, window.scrollY / max ) : 0 ) + ')';
		};
		window.addEventListener( 'scroll', update, { passive: true } );
		window.addEventListener( 'resize', update );
		update();
	} )();
</script>
